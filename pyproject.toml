[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-exposure-monitor"
version = "0.1.0"
description = "Secret Exposure Monitor with Campaign Graph integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.24",
    "aiohttp>=3.8",
    "sqlalchemy>=2.0",
    "asyncpg>=0.28",
    "aiokafka>=0.9",
    "cryptography>=41.0",
    "python-jose[cryptography]>=3.3",
    "structlog>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "black>=23.7",
    "ruff>=0.0.290",
    "mypy>=1.5",
]

[project.scripts]
sem = "secret_exposure_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["secret_exposure_monitor*", "domain*", "scanning*", "correlation_contracts*", "cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
